services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pokespheara
      - eldenring
      - archive
      
    networks:
      - webnet

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bdd_pksa  
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - webnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - webnet
  

  pokespheara:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokespheara
    volumes:
      - ./pokespheara:/var/www/html
    expose:
      - "80"
    depends_on:
      - mysql
    networks:
      - webnet

  eldenring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eldenring
    volumes:
      - ./eldenring:/var/www/html
    expose:
      - "80"
    depends_on:
      - mysql
    networks:
      - webnet
  archive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archive
    volumes:
      - ./archive:/var/www/html
    expose:
      - "80"
    depends_on:
      - mysql
    networks:
      - webnet

volumes:
  mysql_data:
  postgres_data:

networks:
  webnet:
